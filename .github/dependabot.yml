version: 2

updates:
  # npm dependencies. Minor and patch updates are grouped into a single PR to
  # keep review volume manageable; majors are raised individually because they
  # need judgement.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    target-branch: develop
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    target-branch: develop
    labels:
      - dependencies
    commit-message:
      prefix: 'ci(deps)'
