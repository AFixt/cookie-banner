name: Release

# Tags, releases and publishes when a version bump lands on main. Split out of
# ci.yml so releasing is not coupled to the CI job graph — previously it hung
# off an accessibility job marked `continue-on-error`, which meant a failed
# gate could still let a release through.

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Tag, release and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        env:
          # @afixt/a11y-assert pulls in the restricted @afixt/test-utils, so an
          # unauthenticated `npm ci` 404s on its tarball. Authentication comes
          # from the organisation-level NPM_TOKEN secret — see CLAUDE.md.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Check if version changed
        id: version-check
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Check if this version has been tagged
          if git tag --list | grep -q "^v$CURRENT_VERSION$"; then
            echo "version-changed=false" >> $GITHUB_OUTPUT
            echo "Version $CURRENT_VERSION already exists"
          else
            echo "version-changed=true" >> $GITHUB_OUTPUT
            echo "New version detected: $CURRENT_VERSION"
          fi

      - name: Create Git tag
        if: steps.version-check.outputs.version-changed == 'true'
        run: |
          VERSION=${{ steps.version-check.outputs.current-version }}
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        if: steps.version-check.outputs.version-changed == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version-check.outputs.current-version }}
          name: Release v${{ steps.version-check.outputs.current-version }}
          draft: false
          prerelease: false

      # Authentication uses the organisation-level NPM_TOKEN secret. A 404 on
      # publish is an auth problem, not a missing package — see CLAUDE.md.
      - name: Publish to NPM
        if: steps.version-check.outputs.version-changed == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
