name: CI

# Safety net only. The Husky pre-push hook runs `npm run check:all`, so this
# workflow exists to catch what bypasses hooks: `--no-verify`, web UI merges,
# and commits pushed from machines without the hooks installed. Everything
# here is therefore blocking — a `continue-on-error` gate catches nothing.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        env:
          # @afixt/a11y-assert pulls in the restricted @afixt/test-utils, so an
          # unauthenticated `npm ci` 404s on its tarball. Authentication comes
          # from the organisation-level NPM_TOKEN secret — see CLAUDE.md.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Mirrors `npm run check` (lint, format, CSS, Markdown) but as separate
      # steps so a failure names the gate that failed in the Actions summary.
      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint Markdown
        run: npm run lint:md

      - name: Check for code duplication (jscpd)
        run: npm run lint:cpd:ci

      - name: Upload duplication report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: jscpd-report
          path: reports/jscpd/
          retention-days: 30

      - name: Check dependency licences
        run: npm run lint:licenses

      # Build before testing so the built-output guards in the test suite
      # (e.g. test/example-script-paths.test.js) run against a real dist/
      # instead of silently skipping.
      - name: Build project
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload accessibility report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: a11y-report
          path: reports/a11y/
          retention-days: 30

      - name: Upload coverage reports
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  accessibility:
    name: Accessibility (browser)
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        env:
          # @afixt/a11y-assert pulls in the restricted @afixt/test-utils, so an
          # unauthenticated `npm ci` 404s on its tarball. Authentication comes
          # from the organisation-level NPM_TOKEN secret — see CLAUDE.md.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build project
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Layers 3 and 4 of the a11y strategy in docs/adr/0001: @afixt/a11y-assert
      # against the built bundle served over HTTP. Blocking. Playwright starts
      # and stops the preview server itself (see playwright.config.js).
      - name: Run accessibility tests
        run: npm run test:a11y

      # Visual baselines are captured on macOS and render differently on the
      # Linux runners, so this reports without gating. Its config leaves the
      # server to the workflow, so start one for the duration of the step.
      - name: Run visual regression tests
        run: |
          npm run serve &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080 > /dev/null && break
            sleep 1
          done
          npm run test:visual
        continue-on-error: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  bundle-size:
    name: Bundle Size
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        env:
          # @afixt/a11y-assert pulls in the restricted @afixt/test-utils, so an
          # unauthenticated `npm ci` 404s on its tarball. Authentication comes
          # from the organisation-level NPM_TOKEN secret — see CLAUDE.md.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build project
        run: npm run build

      # size-limit enforces the budgets declared in package.json. It is the
      # only bundle gate — do not add a second hand-rolled byte check.
      - name: Check bundle size against budgets
        run: npm run size

      - name: Comment PR with size info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const formatSize = bytes => {
              if (bytes < 1024) return `${bytes} B`;
              if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(2)} KB`;
              return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
            };

            // Canonical asset names only. `cookie-banner.*` is a deprecated
            // alias kept for existing consumers (see issue #66).
            const assets = ['consent.min.js', 'consent.js', 'banner.css'];
            const rows = assets
              .map(name => `| ${name} | ${formatSize(fs.statSync(`dist/${name}`).size)} |`)
              .join('\n');
            const total = assets.reduce((sum, name) => sum + fs.statSync(`dist/${name}`).size, 0);

            const comment = [
              '### 📦 Bundle Size Report',
              '',
              '| File | Size |',
              '|------|------|',
              rows,
              `| **Total** | **${formatSize(total)}** |`,
              '',
              'All bundle sizes are within the budgets configured in `package.json` ✅',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment,
            });
